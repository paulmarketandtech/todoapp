{% extends 'base.html' %}

{% block title %}Edit Todo{% endblock %}

{% block content %}

<h2>Edit Todo</h2>

<form class="edit-form" action="{{ url_for('edit', todo_id=todo.id) }}" method="POST">
    <label for="title">Title</label>
    <input
        type="text"
        id="title"
        name="title"
        value="{{ todo.title }}"
        required
        maxlength="200"
        autofocus
    >

    <label for="description">Description</label>
    <textarea
        id="description"
        name="description"
        rows="4"
        maxlength="500"
    >{{ todo.description or '' }}</textarea>

    <div class="form-actions">
        <button type="submit" class="btn btn-add">Save</button>
        <a href="{{ url_for('index') }}" class="btn btn-cancel">Cancel</a>
    </div>
</form>

{% endblock %}
